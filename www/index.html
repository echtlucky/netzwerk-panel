<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netzwerk-Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===================================================================
   Gestaltung nach SAP Fiori Horizon: flache Flächen, klare Kanten,
   eine einzige Akzentfarbe, Semantikfarben nur für Zustände.
   =================================================================== */
:root{
  --shell:#354a5f; --shell-tx:#ffffff; --shell-tx2:#c2ccd6; --shell-linie:#48606f;
  --grund:#f5f6f7; --flaeche:#ffffff; --flaeche2:#eff1f2; --flaeche3:#e5e9eb;
  --linie:#d9d9d9; --linie2:#c4c9cd;
  --tx:#1d2d3e; --tx2:#556b82; --tx3:#7d8b98;
  --brand:#0070f2; --brand-d:#0057d2; --brand-w:#ebf3fe;
  --pos:#107e3e; --pos-w:#ebf5eb;
  --krit:#e76500; --krit-w:#fff8e5;
  --neg:#bb0000; --neg-w:#ffebeb;
  --info:#7858ff; --info-w:#f2effc;
  --neutral:#6a6d70;
  --schatten:0 0 0 1px rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.06);
  --sans:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-hell]){
    --shell:#1c2228; --shell-tx:#eaecee; --shell-tx2:#a9b4be; --shell-linie:#2b333c;
    --grund:#1c2228; --flaeche:#23292f; --flaeche2:#2b333a; --flaeche3:#333c44;
    --linie:#3a444d; --linie2:#4a555f;
    --tx:#eaecee; --tx2:#a9b4be; --tx3:#8a959f;
    --brand:#4db1ff; --brand-d:#7cc4ff; --brand-w:#1a2b3d;
    --pos:#4caf7d; --pos-w:#1b2b23;
    --krit:#f0913c; --krit-w:#2e2519;
    --neg:#ff8a80; --neg-w:#2e1e1e;
    --info:#a48bff; --info-w:#241f33;
    --schatten:0 0 0 1px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--grund);color:var(--tx);font:14px/1.5 var(--sans);overflow:hidden;
     -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--linie2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--tx3)}

/* ------------------------------------------------------------ Gerüst */
.app{display:grid;grid-template-rows:44px 1fr;height:100vh}
.shell{background:var(--shell);color:var(--shell-tx);display:flex;align-items:center;
       gap:14px;padding:0 14px;border-bottom:1px solid var(--shell-linie)}
.shell .titel{font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.shell .sub{color:var(--shell-tx2);font-size:12.5px;white-space:nowrap;
            overflow:hidden;text-overflow:ellipsis}
.shell .rechts{margin-left:auto;display:flex;align-items:center;gap:8px}
.shell-kn{background:transparent;border:1px solid transparent;color:var(--shell-tx2);
          border-radius:var(--r);padding:5px 10px;font-size:12.5px;cursor:pointer;
          display:flex;align-items:center;gap:6px;transition:.12s;white-space:nowrap}
.shell-kn:hover{background:rgba(255,255,255,.12);color:var(--shell-tx)}
.shell-kn:focus-visible{outline:2px solid var(--shell-tx);outline-offset:1px}
.zustand{display:flex;align-items:center;gap:7px;font:11.5px/1 var(--mono);
         color:var(--shell-tx2);padding-right:4px}
.led{width:7px;height:7px;border-radius:50%;background:var(--pos);flex:0 0 auto}
.led.weg{background:var(--neg)}
.led.demo{background:var(--krit)}

.rumpf{display:grid;grid-template-columns:224px 1fr;overflow:hidden}
nav{background:var(--flaeche);border-right:1px solid var(--linie);overflow-y:auto;padding:6px 0 14px}
nav .gruppe{padding:12px 16px 5px;font-size:10.5px;font-weight:600;letter-spacing:.07em;
            text-transform:uppercase;color:var(--tx3)}
nav a{display:flex;align-items:center;gap:10px;padding:7px 16px;color:var(--tx2);
      text-decoration:none;font-size:13.5px;border-left:3px solid transparent;transition:.1s}
nav a:hover{background:var(--flaeche2);color:var(--tx)}
nav a.aktiv{background:var(--brand-w);color:var(--brand);border-left-color:var(--brand);font-weight:600}
nav a:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
nav a svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6}
nav a .abz{margin-left:auto;font:600 10.5px/1 var(--mono);padding:2px 6px;border-radius:9px;
           background:var(--neg);color:#fff;min-width:18px;text-align:center}
nav a .abz.k{background:var(--krit)}

main{overflow-y:auto;padding:18px 22px 44px}
.kopfzeile{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.kopfzeile h1{font-size:20px;font-weight:600;letter-spacing:-.015em}
.kopfzeile .erklaer{font-size:13px;color:var(--tx2);max-width:70ch}

/* --------------------------------------------------------- Bausteine */
.gitter{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.voll{grid-column:1/-1}

.karte{background:var(--flaeche);border-radius:var(--r);box-shadow:var(--schatten);overflow:hidden}
.karte > header{padding:12px 16px;border-bottom:1px solid var(--linie);display:flex;
                align-items:center;gap:10px;min-height:44px}
.karte > header h2{font-size:14px;font-weight:600;letter-spacing:-.008em}
.karte > header .z{margin-left:auto;font:12px/1 var(--mono);color:var(--tx3)}
.karte > header .werkz{margin-left:auto;display:flex;gap:6px}
.inh{padding:15px 16px}

/* Kachel im Launchpad-Stil */
.kachel{background:var(--flaeche);border-radius:var(--r);box-shadow:var(--schatten);
        padding:14px 15px;display:flex;flex-direction:column;gap:3px;min-height:104px}
.kachel .b{font-size:12.5px;color:var(--tx2);font-weight:600}
.kachel .wert{font:700 30px/1.05 var(--sans);letter-spacing:-.025em;margin-top:auto;
              font-variant-numeric:tabular-nums}
.kachel .wert small{font-size:13px;font-weight:400;color:var(--tx3);letter-spacing:0}
.kachel .fuss{font-size:12px;color:var(--tx3)}
.kachel.k-pos .wert{color:var(--pos)} .kachel.k-krit .wert{color:var(--krit)}
.kachel.k-neg .wert{color:var(--neg)} .kachel.k-brand .wert{color:var(--brand)}
.kachel.klick{cursor:pointer;border:none;text-align:left;width:100%;font-family:inherit}
.kachel.klick:hover{box-shadow:0 0 0 1px var(--brand), 0 3px 10px rgba(0,0,0,.1)}
.kachel.klick:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.kn{background:var(--flaeche);color:var(--brand);border:1px solid var(--linie2);
    border-radius:var(--r);padding:6px 13px;font-size:13px;cursor:pointer;transition:.11s;
    white-space:nowrap}
.kn:hover{background:var(--brand-w);border-color:var(--brand)}
.kn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.kn.stark{background:var(--brand);border-color:var(--brand);color:#fff}
.kn.stark:hover{background:var(--brand-d)}
.kn.klein{padding:3px 9px;font-size:12px}
.kn.an{background:var(--pos-w);border-color:var(--pos);color:var(--pos)}
.kn.aus{background:var(--neg-w);border-color:var(--neg);color:var(--neg)}
.kn[disabled]{opacity:.45;cursor:not-allowed}

dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13px}
dl.kv dt{color:var(--tx2);white-space:nowrap}
dl.kv dd{font-family:var(--mono);font-size:12.5px;text-align:right;
         font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--tx2);padding:9px 14px;
   border-bottom:1px solid var(--linie2);background:var(--flaeche);position:sticky;top:0;
   white-space:nowrap;z-index:2}
th.s{cursor:pointer;user-select:none}
th.s:hover{color:var(--brand)}
td{padding:9px 14px;border-bottom:1px solid var(--linie)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--flaeche2)}
td.m,th.m{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
td.r,th.r{text-align:right}
.rollt{overflow:auto;max-height:calc(100vh - 250px)}
.rollt.kurz{max-height:330px}
.zart{color:var(--tx3);font-size:12px}

.pille{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
       padding:2px 9px;border-radius:11px;white-space:nowrap}
.p-pos{background:var(--pos-w);color:var(--pos)}
.p-krit{background:var(--krit-w);color:var(--krit)}
.p-neg{background:var(--neg-w);color:var(--neg)}
.p-info{background:var(--info-w);color:var(--info)}
.p-brand{background:var(--brand-w);color:var(--brand)}
.p-neutral{background:var(--flaeche3);color:var(--tx2)}
.pkt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.d-pos{background:var(--pos)} .d-krit{background:var(--krit)}
.d-neg{background:var(--neg)} .d-aus{background:var(--tx3)}

.balken{height:6px;background:var(--flaeche3);border-radius:3px;overflow:hidden}
.balken i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width .35s}
.b-pos i{background:var(--pos)} .b-krit i{background:var(--krit)} .b-neg i{background:var(--neg)}
.b-info i{background:var(--info)}

/* Meldung im Message-Strip-Stil */
.strip{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);
       border-left:4px solid;margin-bottom:9px;font-size:13px;background:var(--flaeche)}
.strip:last-child{margin-bottom:0}
.strip b{display:block;font-weight:600;margin-bottom:2px}
.strip span{color:var(--tx2);line-height:1.5}
.strip .kn{margin-left:auto;align-self:center}
.s-neg{border-color:var(--neg);background:var(--neg-w)}
.s-krit{border-color:var(--krit);background:var(--krit-w)}
.s-info{border-color:var(--brand);background:var(--brand-w)}
.s-pos{border-color:var(--pos);background:var(--pos-w)}

.fehlerbox{background:var(--neg-w);border-left:4px solid var(--neg);color:var(--tx);
           padding:12px 15px;border-radius:var(--r);font-size:13px}
.fehlerbox b{display:block;color:var(--neg);margin-bottom:3px}
.leer{color:var(--tx3);font-size:13px;padding:30px 16px;text-align:center}

.sig{display:inline-flex;align-items:center;gap:7px}
.sig .bal{display:flex;gap:2px;align-items:flex-end;height:13px}
.sig .bal i{width:3px;background:var(--linie2);border-radius:1px;display:block}
.sig .bal i.f-pos{background:var(--pos)} .sig .bal i.f-krit{background:var(--krit)}
.sig .bal i.f-neg{background:var(--neg)}

.graph{width:100%;height:60px;display:block}

/* Formularfelder */
input[type=search],input[type=text],input[type=number],select{
  background:var(--flaeche);border:1px solid var(--linie2);border-radius:var(--r);
  padding:6px 11px;color:var(--tx);font-size:13px;min-width:150px}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-w)}
label.f{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--tx2);cursor:pointer;
        white-space:nowrap}
.werkzeug{display:flex;gap:10px;align-items:center;padding:11px 16px;flex-wrap:wrap;
          border-bottom:1px solid var(--linie)}
.feld{display:flex;flex-direction:column;gap:4px;margin-bottom:13px}
[hidden]{display:none !important}
.feld label{font-size:12.5px;font-weight:600;color:var(--tx2)}
.feld .hilfe{font-size:12px;color:var(--tx3);line-height:1.45}

/* Simulator */
.szenario{display:grid;grid-template-columns:1fr auto;gap:11px;align-items:center;
          padding:11px 0;border-bottom:1px solid var(--linie)}
.szenario:last-child{border-bottom:none}
.vergleich{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;
           padding:13px 15px;background:var(--flaeche2);border-radius:var(--r);margin-bottom:12px}
.vergleich .seite{text-align:center}
.vergleich .seite .w{font:700 24px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.vergleich .seite .l{font-size:11.5px;color:var(--tx2);margin-top:2px}
.vergleich .pfeil{color:var(--tx3);font-size:19px}

@media(max-width:900px){
  body{overflow:auto}
  .app{grid-template-rows:44px auto;height:auto}
  .rumpf{grid-template-columns:1fr}
  nav{border-right:none;border-bottom:1px solid var(--linie);display:flex;overflow-x:auto;padding:0}
  nav .gruppe{display:none}
  nav a{border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  nav a.aktiv{border-left:none;border-bottom-color:var(--brand)}
  .rollt{max-height:none}
}
</style>
</head>
<body>

<div class="app">

  <div class="shell">
    <span class="titel">Netzwerk-Panel</span>
    <span class="sub" id="shellSub">verbinde …</span>
    <div class="rechts">
      <span class="zustand"><span class="led" id="led"></span><span id="stand">—</span></span>
      <button class="shell-kn" onclick="frisch()">Neu laden</button>
      <button class="shell-kn" onclick="wechseln('einstellungen')">Einstellungen</button>
    </div>
  </div>

  <div class="rumpf">
    <nav id="navi"></nav>
    <main id="buehne"><div class="leer">wird geladen …</div></main>
  </div>

</div>

<script>
"use strict";

/* ============================================================ Symbole */
const SYM = {
  uebersicht:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  optimierung:'<path d="M3 17l5-5 4 4 8-8"/><path d="M16 8h5v5"/>',
  simulator:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  lokalnetz:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/><path d="M11 8v6M8 11h6"/>',
  mesh:'<circle cx="12" cy="4" r="2"/><circle cx="4" cy="19" r="2"/><circle cx="20" cy="19" r="2"/><path d="M12 6v6M12 12l-7 5M12 12l7 5"/>',
  geraete:'<rect x="2" y="5" width="14" height="10" rx="1"/><path d="M6 19h10"/><rect x="18" y="10" width="4" height="9" rx="1"/>',
  funk:'<path d="M2 8a15 15 0 0120 0M5.5 11.5a10 10 0 0113 0M9 15a5 5 0 016 0"/><circle cx="12" cy="19" r="1.2"/>',
  mobil:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  leitung:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  sicherheit:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  hardware:'<rect x="4" y="8" width="16" height="9" rx="1"/><path d="M8 8V5M16 8V5M7 12h.01M11 12h.01M15 12h.01"/>',
  smarthome:'<path d="M4 11l8-7 8 7v8a1 1 0 01-1 1H5a1 1 0 01-1-1z"/><path d="M10 20v-5h4v5"/>',
  protokoll:'<path d="M6 3h9l4 4v14a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  telefonie:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/>',
  pc:'<rect x="2" y="4" width="20" height="13" rx="1"/><path d="M8 21h8M12 17v4"/>',
  einstellungen:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>'
};
const sym = n => '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">'+(SYM[n]||'')+'</svg>';

/* ==================================================== Ansichtsverzeichnis */
const ANSICHTEN = [
  { id:'uebersicht',    name:'Übersicht',     gruppe:'Überblick', route:'/api/uebersicht',  takt:6000  },
  { id:'optimierung',   name:'Optimierung',   gruppe:'Überblick', route:'/api/optimierung', takt:30000 },
  { id:'simulator',     name:'Simulator',     gruppe:'Überblick', route:'/api/simulator',   takt:0     },
  { id:'lokalnetz',     name:'Netzwerk-Scan', gruppe:'Netz',      route:'/api/lokalnetz',   takt:0     },
  { id:'mesh',          name:'Mesh',          gruppe:'Netz',      route:'/api/mesh',        takt:20000 },
  { id:'geraete',       name:'Geräte',        gruppe:'Netz',      route:'/api/geraete',     takt:10000 },
  { id:'funk',          name:'Funk',          gruppe:'Netz',      route:'/api/funk',        takt:20000 },
  { id:'mobil',         name:'Mobilgeräte',   gruppe:'Netz',      route:'/api/mobil',       takt:30000 },
  { id:'leitung',       name:'Leitung',       gruppe:'Netz',      route:'/api/leitung',     takt:6000  },
  { id:'sicherheit',    name:'Sicherheit',    gruppe:'Betrieb',   route:'/api/sicherheit',  takt:60000 },
  { id:'protokoll',     name:'Protokoll',     gruppe:'Betrieb',   route:'/api/protokoll',   takt:30000 },
  { id:'smarthome',     name:'Smart Home',    gruppe:'Betrieb',   route:'/api/smarthome',   takt:20000 },
  { id:'telefonie',     name:'Telefonie',     gruppe:'Betrieb',   route:'/api/telefonie',   takt:60000 },
  { id:'hardware',      name:'Geräteberatung',gruppe:'Beratung',  route:'/api/hardware',    takt:0     },
  { id:'pc',            name:'Dieser PC',     gruppe:'System',    route:'/api/pc',          takt:30000 },
  { id:'einstellungen', name:'Einstellungen', gruppe:'System',    route:'/api/einstellungen', takt:0   },
];

let aktiv='uebersicht', daten={}, uhr=null, simErgebnis=null;
let sortSp='IP', sortAb=false;
const filter={q:'',online:true,funk:false};

/* ============================================================== Helfer */
const esc = t => String(t ?? '').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const istFehler = o => !!(o && typeof o==='object' && !Array.isArray(o) && 'fehler' in o);
const arr = o => (istFehler(o)||!o) ? [] : (Array.isArray(o)?o:[o]);
const ipZahl = ip => String(ip||'').split('.').map(Number).reduce((a,b)=>a*256+(b||0),0)||0;
const zahl = (n,k=0) => (Number(n)||0).toLocaleString('de-DE',{minimumFractionDigits:k,maximumFractionDigits:k});

function dauer(s){
  s=Number(s)||0;
  const t=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(t) return t+' T '+h+' h';
  if(h) return h+' h '+m+' min';
  return m+' min';
}
function bytes(b){
  b=Number(b)||0; const e=['B','KB','MB','GB','TB']; let i=0;
  while(b>=1024&&i<e.length-1){b/=1024;i++;}
  return zahl(b,i?1:0)+' '+e[i];
}
function note(w,gut,mittel,umgekehrt){
  if(umgekehrt) return w<=gut?'pos':(w<=mittel?'krit':'neg');
  return w>=gut?'pos':(w>=mittel?'krit':'neg');
}
function fehlerBlock(o,was){
  return '<div class="fehlerbox"><b>'+esc(was)+' nicht abrufbar</b>'+esc(o.fehler)+'</div>';
}
function karte(titel,inhalt,opt){
  opt=opt||{};
  const z=opt.zahl?'<span class="z">'+esc(opt.zahl)+'</span>':'';
  const w=opt.werkzeug?'<span class="werkz">'+opt.werkzeug+'</span>':'';
  const i=opt.roh?inhalt:'<div class="inh">'+inhalt+'</div>';
  return '<section class="karte'+(opt.voll?' voll':'')+'"><header><h2>'+esc(titel)+'</h2>'+w+z+'</header>'+i+'</section>';
}
function kachel(wert,titel,fuss,farbe,ansicht){
  const k='kachel'+(farbe?' k-'+farbe:'')+(ansicht?' klick':'');
  const inh='<span class="b">'+esc(titel)+'</span><span class="wert">'+wert+'</span>'+
            (fuss?'<span class="fuss">'+esc(fuss)+'</span>':'');
  return ansicht
    ? '<button class="'+k+'" onclick="wechseln(\''+ansicht+'\')">'+inh+'</button>'
    : '<div class="'+k+'">'+inh+'</div>';
}
function graph(reihe,max,farbe){
  const r=(reihe||[]).slice().reverse();
  if(r.length<2) return '<div class="zart" style="padding:12px 0">noch keine Messreihe</div>';
  const b=300,h=56,m=Math.max(max||0,...r,1);
  const px=i=>(i/(r.length-1))*b, py=v=>h-(Math.min(v,m)/m)*(h-4)-2;
  const l=r.map((v,i)=>(i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1)).join(' ');
  return '<svg class="graph" viewBox="0 0 '+b+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+l+' L'+b+' '+h+' L0 '+h+' Z" fill="var(--'+farbe+')" opacity=".13"/>'+
    '<path d="'+l+'" fill="none" stroke="var(--'+farbe+')" stroke-width="1.5" '+
    'stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>';
}
function signal(p){
  p=Number(p)||0;
  const k=p>=60?'f-pos':(p>=40?'f-krit':'f-neg');
  let b='';
  for(let i=1;i<=4;i++) b+='<i class="'+(p>=i*20?k:'')+'" style="height:'+(i*3+1)+'px"></i>';
  return '<span class="sig"><span class="bal">'+b+'</span><span class="m">'+p+' %</span></span>';
}

/* =============================================================== Laden */
async function laden(){
  const a=ANSICHTEN.find(x=>x.id===aktiv);
  try{
    const r=await fetch(a.route,{cache:'no-store'});
    const d=await r.json();
    if(istFehler(d)&&Object.keys(d).length===1) throw new Error(d.fehler);
    daten[aktiv]=d;
    document.getElementById('led').classList.remove('weg');
    if(d.Zeit) document.getElementById('stand').textContent=d.Zeit;
    zeichnen();
  }catch(e){
    document.getElementById('led').classList.add('weg');
    document.getElementById('buehne').innerHTML=
      '<div class="fehlerbox"><b>Keine Verbindung zur FRITZ!Box</b>'+esc(e.message)+
      '<div style="margin-top:10px;color:var(--tx2)">Prüfen: Ist <span class="m">netzpanel einrichten</span> '+
      'durchgelaufen, und steht in der Box unter Heimnetz → Netzwerk → Netzwerkeinstellungen '+
      'der Haken bei „Zugriff für Anwendungen zulassen"?</div></div>';
  }
}
function frisch(){ fetch('/api/leeren').then(laden).catch(laden); }

function wechseln(id){
  const a=ANSICHTEN.find(x=>x.id===id);
  if(!a) return;
  aktiv=id;
  location.hash=id;
  document.querySelectorAll('#navi a').forEach(el=>el.classList.toggle('aktiv',el.dataset.id===id));
  document.getElementById('buehne').innerHTML='<div class="leer">wird geladen …</div>';
  document.getElementById('buehne').scrollTop=0;
  if(uhr) clearInterval(uhr);
  laden();
  if(a.takt>0) uhr=setInterval(laden,a.takt);
}

function navBauen(){
  let h='',gruppe='';
  ANSICHTEN.forEach(a=>{
    if(a.gruppe!==gruppe){ gruppe=a.gruppe; h+='<div class="gruppe">'+esc(gruppe)+'</div>'; }
    h+='<a href="#'+a.id+'" data-id="'+a.id+'" onclick="wechseln(\''+a.id+'\');return false;">'+
       sym(a.id)+'<span>'+esc(a.name)+'</span>'+
       '<span class="abz" id="abz-'+a.id+'" hidden></span></a>';
  });
  document.getElementById('navi').innerHTML=h;
}
function abzeichen(id,text,art){
  const el=document.getElementById('abz-'+id);
  if(!el) return;
  if(!text){ el.hidden=true; return; }
  el.hidden=false; el.textContent=text;
  el.className='abz'+(art==='krit'?' k':'');
}

function zeichnen(){
  const d=daten[aktiv];
  if(!d) return;
  const f={uebersicht:zUebersicht,optimierung:zOptimierung,simulator:zSimulator,mesh:zMesh,
           geraete:zGeraete,funk:zFunk,mobil:zMobil,leitung:zLeitung,sicherheit:zSicherheit,
           protokoll:zProtokoll,smarthome:zSmartHome,telefonie:zTelefonie,hardware:zHardware,
           lokalnetz:zLokalnetz,pc:zPc,einstellungen:zEinstellungen}[aktiv];
  document.getElementById('buehne').innerHTML=
    '<div class="kopfzeile"><h1>'+esc(ANSICHTEN.find(x=>x.id===aktiv).name)+'</h1>'+
    (ERKLAERUNG[aktiv]?'<span class="erklaer">'+esc(ERKLAERUNG[aktiv])+'</span>':'')+'</div>'+f(d);
}

const ERKLAERUNG={
  lokalnetz:'Was dein Rechner selbst über das Netz herausfinden kann — ohne Zugang zur FRITZ!Box.',
  optimierung:'Was im Funknetz Leistung kostet — und was es bringen würde, das zu ändern.',
  simulator:'Umbauten durchrechnen, bevor man sie macht. Es wird nichts geschaltet.',
  mobil:'Was der Verbindung von Handys und Tablets im Weg steht.',
  hardware:'Vorschläge aus dem gemessenen Zustand deines Netzes — nicht aus einer Bestenliste.',
  leitung:'Der Zustand des Anschlusses selbst, unabhängig vom WLAN.',
  einstellungen:'Verbindung, Bewertungsschwellen und Anzeige.'
};

/* ========================================================== ÜBERSICHT */
function zUebersicht(d){
  let h='';
  const w=d.Warnungen||[];
  const kritisch=w.filter(x=>x.Stufe==='kritisch').length;
  const warn=w.filter(x=>x.Stufe==='warn').length;
  abzeichen('uebersicht',kritisch||warn||'',kritisch?'':'krit');

  const box=d.Box, wan=d.Wan, ds=d.Durchsatz, z=d.Zaehler, dsl=d.Dsl;
  if(box&&!istFehler(box)) document.getElementById('shellSub').textContent=box.Modell;

  // Kachelreihe
  h+='<div class="gitter g4">';
  if(!istFehler(ds)&&!istFehler(wan))
    h+=kachel(zahl(ds.DownMbit,1)+'<small> Mbit/s</small>','Download jetzt',
              'von '+zahl(wan.DownMbit,1)+' Mbit/s Leitung','brand','leitung');
  if(z) h+=kachel(zahl(z.Online),'Geräte online',z.Kabel+' am Kabel · '+z.Funk+' per Funk','',
                  'geraete');
  if(!istFehler(dsl)){
    const k=note(dsl.DownStoerabstand,10,6);
    h+=kachel(zahl(dsl.DownStoerabstand,1)+'<small> dB</small>','Störabstand',
              k==='pos'?'solide Reserve':(k==='krit'?'wenig Reserve':'kritisch'),k,'leitung');
  }
  h+=kachel(String(kritisch+warn),'Offene Punkte',
            kritisch?kritisch+' davon kritisch':'nichts Kritisches',
            kritisch?'neg':(warn?'krit':'pos'),'optimierung');
  h+='</div>';

  // Meldungen
  if(w.length){
    const rang={kritisch:0,warn:1,info:2};
    const s=w.slice().sort((a,b)=>(rang[a.Stufe]??3)-(rang[b.Stufe]??3));
    h+=karte('Was Aufmerksamkeit braucht',s.map(x=>{
      const kl=x.Stufe==='kritisch'?'s-neg':(x.Stufe==='warn'?'s-krit':'s-info');
      const kn=x.Ansicht?'<button class="kn klein" onclick="wechseln(\''+x.Ansicht+'\')">ansehen</button>':'';
      return '<div class="strip '+kl+'"><div><b>'+esc(x.Titel)+'</b><span>'+esc(x.Text)+'</span></div>'+kn+'</div>';
    }).join(''),{voll:true,zahl:w.length+' Punkte'});
  }else{
    h+=karte('Lage','<div class="strip s-pos"><div><b>Nichts zu beanstanden</b>'+
      '<span>Leitung, Mesh, Funk und Sicherheitseinstellungen sind unauffällig.</span></div></div>',
      {voll:true});
  }

  h+='<div class="gitter g2">';
  if(!istFehler(wan)){
    const dd=istFehler(ds)?null:ds;
    h+=karte('Internetzugang',
      '<div style="display:flex;gap:20px;margin-bottom:12px">'+
      '<div style="flex:1"><div class="zart">Download</div>'+graph(dd?dd.VerlaufDown:[],wan.DownMbit,'brand')+'</div>'+
      '<div style="flex:1"><div class="zart">Upload</div>'+graph(dd?dd.VerlaufUp:[],wan.UpMbit,'info')+'</div></div>'+
      '<dl class="kv"><dt>Leitung</dt><dd>'+zahl(wan.DownMbit,1)+' / '+zahl(wan.UpMbit,1)+' Mbit/s</dd>'+
      '<dt>Status</dt><dd>'+esc(wan.Status)+'</dd>'+
      '<dt>Externe IP</dt><dd>'+esc(wan.ExterneIP)+'</dd>'+
      '<dt>Online seit</dt><dd>'+dauer(wan.OnlineSeitSek)+'</dd></dl>',{zahl:wan.Zugangsart});
  }
  if(!istFehler(box)){
    const fw=d.Firmware;
    let fwZ='';
    if(!istFehler(fw)) fwZ=fw.UpdateVerfuegbar
      ? '<dt>Update</dt><dd><span class="pille p-krit">'+esc(fw.NeueVersion)+' verfügbar</span></dd>'
      : '<dt>Update</dt><dd><span class="pille p-pos">aktuell</span></dd>';
    h+=karte('Router','<dl class="kv"><dt>Modell</dt><dd>'+esc(box.Modell)+'</dd>'+
      '<dt>FRITZ!OS</dt><dd>'+esc(box.Firmware)+'</dd>'+
      '<dt>Laufzeit</dt><dd>'+dauer(box.LaufzeitSek)+'</dd>'+fwZ+'</dl>');
  }
  h+='</div>';

  h+='<div class="gitter g2">';
  const m=d.Mesh;
  h+=istFehler(m)?karte('Mesh',fehlerBlock(m,'Mesh-Topologie'))
    :karte('Mesh',meshListe(m),{zahl:arr(m.Knoten).length+' Knoten'});
  h+=karte('Antwortzeiten',(d.Latenz||[]).map(l=>{
    let k='d-neg',t='keine Antwort';
    if(l.Ms!==null&&l.Ms!==undefined){ t=l.Ms+' ms'; k=l.Ms<=1?'d-pos':(l.Ms<=4?'d-krit':'d-neg'); }
    return '<div style="display:flex;gap:10px;align-items:center;padding:4px 0">'+
      '<span class="pkt '+k+'"></span><span style="color:var(--tx2)">'+esc(l.Ziel)+'</span>'+
      '<span class="m" style="margin-left:auto">'+t+'</span></div>';
  }).join('')||'<div class="zart">keine Ziele</div>');
  h+='</div>';
  return h;
}

function meshListe(m){
  const kn=arr(m.Knoten), vb=arr(m.Verbindungen);
  if(!kn.length) return '<div class="zart">keine Mesh-Daten</div>';
  return kn.map(k=>{
    const meine=vb.filter(v=>v.Von===k.Name||v.Nach===k.Name);
    const st=meine.map(v=>{
      const ziel=v.Von===k.Name?v.Nach:v.Von;
      const max=Math.max(v.MaxRx||0,v.MaxTx||0);
      const kl=v.Art==='LAN'?note(max,900,200):note(max,700,300);
      return '<div style="display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:6px 0;'+
        'border-top:1px solid var(--linie)">'+
        '<span style="font-size:12.5px;color:var(--tx2)"><span class="pille '+
          (v.Art==='LAN'?'p-brand':'p-info')+'">'+esc(v.Art)+
          (v.Band?' '+esc(v.Band.replace('WLAN:','')):'')+'</span> '+esc(ziel)+'</span>'+
        '<span class="m">'+zahl(max)+' Mbit/s</span>'+
        '<span style="grid-column:1/-1"><span class="balken b-'+kl+'"><i style="width:'+
          Math.min(100,(max/1000)*100)+'%"></i></span></span></div>';
    }).join('')||'<div class="zart" style="padding:6px 0">keine Mesh-Strecke</div>';
    return '<div style="padding:11px 0;border-bottom:1px solid var(--linie)">'+
      '<div style="display:flex;align-items:baseline;gap:9px"><b>'+esc(k.Name)+'</b>'+
      '<span class="pille '+(k.Rolle==='master'?'p-brand':'p-neutral')+'">'+
      (k.Rolle==='master'?'Router':'Repeater')+'</span>'+
      (k.Clients?'<span class="zart" style="margin-left:auto">'+k.Clients+' Geräte</span>':'')+'</div>'+
      '<div class="zart" style="margin:1px 0 4px">'+esc(k.Modell||'')+
      (k.Firmware?' · '+esc(k.Firmware):'')+'</div>'+st+'</div>';
  }).join('');
}

/* ======================================================== OPTIMIERUNG */
function zOptimierung(d){
  let h='';
  const at=arr(d.Airtime), vs=arr(d.Vorschlaege);
  abzeichen('optimierung',vs.length||'','krit');

  if(vs.length){
    h+=karte('Vorschläge, nach Wirkung sortiert',vs.map(v=>
      '<div class="strip s-info"><div>'+
      '<b>'+esc(v.Titel)+' <span class="pille p-pos">+'+v.Gewinn+' %</span></b>'+
      '<span>'+esc(v.Text)+'</span></div>'+
      '<button class="kn klein" onclick="simVorschlag(\''+esc(v.Art)+'\',\''+esc(v.MAC)+
        '\',\''+esc(v.Ziel)+'\')">durchrechnen</button></div>').join(''),
      {voll:true,zahl:vs.length+' Vorschläge'});
  }else{
    h+=karte('Vorschläge','<div class="strip s-pos"><div><b>Nichts zu holen</b>'+
      '<span>Im Funknetz ist derzeit kein Umbau erkennbar, der spürbar etwas brächte.</span>'+
      '</div></div>',{voll:true});
  }

  if(!at.length) return h+karte('Sendezeit','<div class="leer">Keine Funkgeräte verbunden.</div>',{voll:true});

  h+=karte('Wie die Sendezeit verteilt ist',
    '<div class="zart" style="margin-bottom:13px;line-height:1.55">In einem Funkband sendet immer nur '+
    'ein Gerät gleichzeitig. Für dieselbe Datenmenge braucht ein langsames Gerät ein Vielfaches der Zeit '+
    'eines schnellen — und blockiert das Band solange für alle anderen. Deshalb wird ein Netz durch '+
    'sein langsamstes Gerät gebremst, nicht durch sein schnellstes.</div>',{voll:true});

  at.forEach(b=>{
    const zeilen=arr(b.Geraete).map(g=>{
      const kl=g.Last>1.5?'neg':(g.Last>1?'krit':'pos');
      return '<tr><td>'+esc(g.Name||g.IP||g.MAC)+'</td>'+
        '<td class="m r">'+zahl(g.Rate)+' Mbit</td>'+
        '<td>'+signal(g.Signal)+'</td>'+
        '<td class="m r">'+zahl(g.AirtimeAnteil,1)+' %</td>'+
        '<td style="width:130px"><span class="balken b-'+kl+'"><i style="width:'+
          Math.min(100,g.AirtimeAnteil)+'%"></i></span></td>'+
        '<td class="m r" style="color:var(--'+kl+')">'+zahl(g.Last,2)+'×</td>'+
        '<td class="r"><button class="kn klein" onclick="simVorschlag(\'kabel\',\''+esc(g.MAC)+
          '\',\'\')">durchrechnen</button></td></tr>';
    }).join('');

    const gewinn=b.OhneBremseMbit?Math.round(((b.OhneBremseMbit-b.NutzbarMbit)/b.NutzbarMbit)*100):0;
    h+=karte(b.Band,
      '<div class="werkzeug" style="border-top:none">'+
        '<div><div class="zart">nutzbar zusammen</div><b class="m" style="font-size:16px">'+
          zahl(b.NutzbarMbit)+' Mbit/s</b></div>'+
        '<div><div class="zart">im Mittel je Gerät</div><b class="m" style="font-size:16px">'+
          zahl(b.ProGeraetMbit)+' Mbit/s</b></div>'+
        '<div><div class="zart">schnellstes Gerät</div><b class="m" style="font-size:16px">'+
          zahl(b.SchnellstMbit)+' Mbit/s</b></div>'+
        (b.OhneBremseMbit?'<div style="margin-left:auto;text-align:right">'+
          '<div class="zart">ohne '+esc(b.Bremse.Name||b.Bremse.IP)+'</div>'+
          '<b class="m" style="font-size:16px;color:var(--pos)">'+zahl(b.OhneBremseMbit)+
          ' Mbit/s (+'+gewinn+' %)</b></div>':'')+
      '</div>'+
      '<table><thead><tr><th>Gerät</th><th class="r">Aushandlung</th><th>Signal</th>'+
      '<th class="r">Sendezeit</th><th></th><th class="r">Last</th><th></th></tr></thead>'+
      '<tbody>'+zeilen+'</tbody></table>',
      {voll:true,roh:true,zahl:b.Anzahl+' Geräte'});
  });
  return h;
}

/* =========================================================== SIMULATOR */
function zSimulator(d){
  const funk=arr(d.Funk), ger=arr(d.Geraete), netze=arr(d.Netze);
  if(!funk.length) return karte('Simulator','<div class="leer">Keine Funkgeräte verbunden — es gibt nichts zu simulieren.</div>',{voll:true});

  const namen={};
  ger.forEach(g=>{ if(g.MAC) namen[g.MAC.toUpperCase()]=g.Name; });
  const nameVon=m=>namen[(m||'').toUpperCase()]||m;

  const auswahl=funk.map(c=>'<option value="'+esc(c.MAC)+'">'+esc(nameVon(c.MAC))+
    ' — '+esc(c.Band)+', '+zahl(c.SpeedMbit)+' Mbit</option>').join('');
  const baender=[...new Set(netze.map(n=>n.Band))].map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');

  let h=karte('Was möchtest du durchrechnen?',
    '<div class="feld"><label for="simGeraet">Gerät</label>'+
      '<select id="simGeraet" style="min-width:280px">'+auswahl+'</select></div>'+
    '<div class="feld"><label for="simSzenario">Änderung</label>'+
      '<select id="simSzenario" onchange="simZielFeld()">'+
        '<option value="kabel">ans Netzwerkkabel anschließen</option>'+
        '<option value="bandwechsel">in ein anderes Funknetz umziehen</option>'+
        '<option value="signal">besseres Signal geben (näherer Repeater)</option>'+
        '<option value="entfernen">abschalten oder aus dem Netz nehmen</option>'+
      '</select></div>'+
    '<div class="feld" id="simZielBand" hidden><label for="simZiel">Zielnetz</label>'+
      '<select id="simZiel">'+baender+'</select></div>'+
    '<div class="feld" id="simZielSignal" hidden><label for="simSignalWert">Neues Signal in Prozent</label>'+
      '<input type="number" id="simSignalWert" value="75" min="10" max="100" step="5">'+
      '<span class="hilfe">Ein Repeater im selben Raum bringt üblicherweise 70 bis 90 Prozent.</span></div>'+
    '<button class="kn stark" onclick="simulieren()">Durchrechnen</button>'+
    '<div class="hilfe" style="margin-top:11px">Es wird nichts geschaltet. Die Rechnung beruht auf den '+
    'aktuell ausgehandelten Datenraten und schätzt, wie sich die Sendezeit im Band neu verteilt.</div>',
    {voll:true});

  h+='<div id="simErgebnis">'+(simErgebnis?simAusgabe(simErgebnis):'')+'</div>';
  return h;
}
function simZielFeld(){
  const s=document.getElementById('simSzenario').value;
  document.getElementById('simZielBand').hidden = s!=='bandwechsel';
  document.getElementById('simZielSignal').hidden = s!=='signal';
}
async function simulieren(){
  const mac=document.getElementById('simGeraet').value;
  const sz=document.getElementById('simSzenario').value;
  let ziel='';
  if(sz==='bandwechsel') ziel=document.getElementById('simZiel').value;
  if(sz==='signal') ziel=document.getElementById('simSignalWert').value;
  await simLauf(sz,mac,ziel);
}
async function simVorschlag(art,mac,ziel){
  if(aktiv!=='simulator'){ wechseln('simulator'); await new Promise(r=>setTimeout(r,450)); }
  await simLauf(art,mac,ziel);
}
async function simLauf(szenario,mac,ziel){
  const ziel_el=document.getElementById('simErgebnis');
  if(ziel_el) ziel_el.innerHTML='<div class="leer">wird gerechnet …</div>';
  try{
    const r=await fetch('/api/simulieren',{method:'POST',
      body:JSON.stringify({szenario:szenario,mac:mac,ziel:String(ziel||'')})});
    const d=await r.json();
    if(d.fehler) throw new Error(d.fehler);
    simErgebnis=d;
    if(ziel_el) ziel_el.innerHTML=simAusgabe(d);
  }catch(e){
    if(ziel_el) ziel_el.innerHTML='<div class="fehlerbox"><b>Rechnung fehlgeschlagen</b>'+esc(e.message)+'</div>';
  }
}
function simAusgabe(d){
  const g=d.Gesamt||{};
  const besser=g.AenderungProz>0, schlechter=g.AenderungProz<0;
  const farbe=besser?'pos':(schlechter?'neg':'neutral');

  let h=karte('Ergebnis: '+d.Beschreibung,
    '<div class="vergleich">'+
      '<div class="seite"><div class="w">'+zahl(g.MittelVorherMbit)+'</div>'+
        '<div class="l">Mbit/s je Funkgerät — heute</div></div>'+
      '<div class="pfeil">→</div>'+
      '<div class="seite"><div class="w" style="color:var(--'+farbe+')">'+zahl(g.MittelNachherMbit)+'</div>'+
        '<div class="l">Mbit/s je Funkgerät — danach</div></div>'+
    '</div>'+
    '<div class="strip s-'+(besser?'pos':(schlechter?'krit':'info'))+'"><div>'+
      '<b>'+(besser?'Das bringt etwas: +'+g.AenderungProz+' %'
             :(schlechter?'Das kostet Leistung: '+g.AenderungProz+' %'
             :'Kein messbarer Unterschied'))+'</b>'+
      '<span>'+(besser
        ?'Alle Funkgeräte bekommen im Mittel mehr Sendezeit.'
        :(schlechter
          ?'Das umgestellte Gerät wird zwar schneller, nimmt den anderen im Zielnetz aber Sendezeit weg. Unter dem Strich verliert das Netz.'
          :'Die Verteilung der Sendezeit bleibt praktisch gleich.'))+'</span></div></div>',
    {voll:true});

  if(d.GeraetVorher){
    const v=d.GeraetVorher, n=d.GeraetNachher;
    h+=karte('Das Gerät selbst: '+d.Geraet,
      '<dl class="kv">'+
      '<dt>Netz</dt><dd>'+esc(v.Band)+' → '+esc(n?n.Band:'aus')+'</dd>'+
      '<dt>Aushandlung</dt><dd>'+zahl(v.Rate)+' → '+(n?zahl(n.Rate):'—')+' Mbit/s</dd>'+
      (n&&n.Signal?'<dt>Signal</dt><dd>'+v.Signal+' → '+n.Signal+' %</dd>':'')+
      '</dl>');
  }

  h+=karte('Auswirkung je Funknetz',
    '<table><thead><tr><th>Netz</th><th class="r">heute</th><th class="r">danach</th>'+
    '<th class="r">Änderung</th><th class="r">Geräte</th></tr></thead><tbody>'+
    arr(d.Vergleich).map(v=>{
      const k=v.AenderungProz>0?'pos':(v.AenderungProz<0?'neg':'');
      return '<tr><td>'+esc(v.Band)+'</td>'+
        '<td class="m r">'+zahl(v.VorherMbit)+' Mbit/s</td>'+
        '<td class="m r">'+zahl(v.NachherMbit)+' Mbit/s</td>'+
        '<td class="m r"'+(k?' style="color:var(--'+k+')"':'')+'>'+
          (v.AenderungProz>0?'+':'')+v.AenderungProz+' %</td>'+
        '<td class="m r">'+v.VorherAnzahl+' → '+v.NachherAnzahl+'</td></tr>';
    }).join('')+'</tbody></table>',{voll:true,roh:true});

  h+='<div class="hilfe" style="padding:0 2px">Modellrechnung aus den ausgehandelten Datenraten. '+
     'Sie zeigt Größenordnung und Richtung zuverlässig, ersetzt aber keine Messung.</div>';
  return h;
}

/* ================================================================ MESH */
function zMesh(d){
  const m=d.Mesh;
  if(istFehler(m)) return fehlerBlock(m,'Mesh-Topologie');
  const kn=arr(m.Knoten);
  if(!kn.length) return '<div class="leer">Keine Mesh-Daten.</div>';
  return karte('Topologie',meshDiagramm(m),{voll:true,
      zahl:kn.length+' Knoten · '+arr(m.Verbindungen).length+' Strecken'})+
    karte('Knoten im Einzelnen',meshListe(m),{voll:true});
}
function meshDiagramm(m){
  const kn=arr(m.Knoten), vb=arr(m.Verbindungen);
  const master=kn.find(k=>k.Rolle==='master')||kn[0];
  const rest=kn.filter(k=>k!==master);
  const B=840, sp=rest.length?B/rest.length:B, H=232;

  let s='<div style="overflow-x:auto"><svg viewBox="0 0 '+B+' '+H+'" role="img" '+
    'style="min-width:620px;width:100%;height:auto;display:block" aria-label="Mesh-Topologie">'+
    '<style>.nd{fill:var(--flaeche2);stroke:var(--linie2);stroke-width:1}'+
    '.ndm{fill:var(--brand-w);stroke:var(--brand);stroke-width:1.5}'+
    '.tn{font:600 12.5px var(--sans);fill:var(--tx)}'+
    '.ts{font:10.5px var(--mono);fill:var(--tx3)}'+
    '.tr{font:600 10.5px var(--mono)}'+
    '.fp{fill:var(--pos)}.fk{fill:var(--krit)}.fn{fill:var(--neg)}'+
    '.kp{stroke:var(--pos);stroke-width:2.5;fill:none}'+
    '.kk{stroke:var(--krit);stroke-width:2;fill:none;stroke-dasharray:6 3}'+
    '.kn2{stroke:var(--neg);stroke-width:1.5;fill:none;stroke-dasharray:3 3}</style>';

  const mx=B/2;
  s+='<rect class="ndm" x="'+(mx-115)+'" y="10" width="230" height="48" rx="6"/>'+
     '<text class="tn" x="'+mx+'" y="30" text-anchor="middle">'+esc(master.Name)+'</text>'+
     '<text class="ts" x="'+mx+'" y="46" text-anchor="middle">'+esc(master.Modell||'')+'</text>';

  rest.forEach((k,i)=>{
    const x=sp*i+sp/2;
    const v=vb.find(v=>(v.Von===master.Name&&v.Nach===k.Name)||(v.Nach===master.Name&&v.Von===k.Name));
    const max=v?Math.max(v.MaxRx||0,v.MaxTx||0):0;
    const n=!v?'neg':(v.Art==='LAN'?note(max,900,200):note(max,700,300));
    const kk={pos:'kp',krit:'kk',neg:'kn2'}[n], ff={pos:'fp',krit:'fk',neg:'fn'}[n];
    const art=v?(v.Art==='LAN'?'Kabel':'Funk'+(v.Band?' '+v.Band.replace('WLAN:',''):'')):'getrennt';

    s+='<path class="'+kk+'" d="M'+mx+' 58 L'+mx+' 86 L'+x+' 86 L'+x+' 124"/>'+
       '<text class="tr '+ff+'" x="'+x+'" y="116" text-anchor="middle">'+esc(art)+
         (max?' · '+zahl(max)+' Mbit':'')+'</text>'+
       '<rect class="nd" x="'+(x-102)+'" y="124" width="204" height="48" rx="6"/>'+
       '<text class="tn" x="'+x+'" y="144" text-anchor="middle">'+esc(k.Name)+'</text>'+
       '<text class="ts" x="'+x+'" y="160" text-anchor="middle">'+esc(k.Modell||'')+
         (k.Clients?' · '+k.Clients+' Geräte':'')+'</text>';
  });
  s+='</svg></div>'+
    '<div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;padding-top:12px;'+
    'border-top:1px solid var(--linie);font:11.5px var(--mono);color:var(--tx3)">'+
    ['pos','krit','neg'].map((f,i)=>'<span><span style="display:inline-block;width:20px;height:2px;'+
      'background:var(--'+f+');vertical-align:middle;margin-right:7px"></span>'+
      ['volle Rate','brauchbar','zu langsam'][i]+'</span>').join('')+'</div>';
  return s;
}

/* ============================================================= GERÄTE */
function zGeraete(d){
  const g=d.Geraete;
  if(istFehler(g)) return fehlerBlock(g,'Geräteliste');
  const funk=arr(d.Funk), sigVon={};
  funk.forEach(c=>{ sigVon[(c.MAC||'').toUpperCase()]=c; });

  const gesperrt=arr(g).filter(x=>x.Gesperrt).length;
  abzeichen('geraete',gesperrt||'','');

  let liste=arr(g).filter(x=>{
    if(filter.online&&!x.Aktiv) return false;
    if(filter.funk&&x.Art!=='802.11') return false;
    if(!filter.q) return true;
    return [x.Name,x.IP,x.MAC,x.Hersteller,x.Modell].join(' ').toLowerCase()
      .includes(filter.q.toLowerCase());
  });
  liste.sort((a,b)=>{
    let x=a[sortSp],y=b[sortSp];
    if(sortSp==='IP'){x=ipZahl(x);y=ipZahl(y);}
    if(sortSp==='Speed'){x=Number(x)||0;y=Number(y)||0;}
    if(typeof x==='string'){const c=x.localeCompare(y||'');return sortAb?-c:c;}
    return sortAb?(y-x):(x-y);
  });
  const th=(sp,t,kl)=>'<th class="s'+(kl?' '+kl:'')+'" onclick="sortiere(\''+sp+'\')">'+esc(t)+
    (sortSp===sp?(sortAb?' ↓':' ↑'):'')+'</th>';

  const zeilen=liste.map(x=>{
    const c=sigVon[(x.MAC||'').toUpperCase()];
    let anb='<span class="pille p-neutral">offline</span>';
    if(x.Aktiv){
      if(x.Art==='Ethernet') anb='<span class="pille p-brand">Kabel'+(x.Port?' '+esc(x.Port):'')+'</span>';
      else if(x.Art==='802.11') anb='<span class="pille p-info">Funk'+(c?' '+esc(c.Band):'')+'</span>';
      else anb='<span class="pille p-neutral">'+esc(x.Art||'?')+'</span>';
    }
    const sp=Number(x.Speed)||0, spK=(x.Aktiv&&sp)?note(sp,900,200):null;
    let zu='';
    if(x.Gast) zu+='<span class="pille p-krit">Gast</span> ';
    if(x.Gesperrt) zu+='<span class="pille p-neg">gesperrt</span> ';
    if(x.UpdateVerf) zu+='<span class="pille p-info">Update</span> ';
    if(!zu) zu='<span class="pkt '+(x.Aktiv?'d-pos':'d-aus')+'"></span>';

    return '<tr><td><div>'+esc(x.Name||'(ohne Namen)')+'</div>'+
      ((x.Modell||x.Hersteller)?'<div class="zart">'+esc(x.Modell||x.Hersteller)+'</div>':'')+'</td>'+
      '<td class="m">'+esc(x.IP)+'</td><td class="m zart">'+esc(x.MAC)+'</td><td>'+anb+'</td>'+
      '<td class="m r"'+(spK?' style="color:var(--'+spK+')"':'')+'>'+
        (x.Aktiv&&sp?zahl(sp)+' Mbit':'—')+'</td>'+
      '<td>'+(c?signal(c.Signal):'<span class="zart">—</span>')+'</td><td>'+zu+'</td>'+
      '<td class="r" style="white-space:nowrap">'+
        (x.Gesperrt
          ?'<button class="kn klein aus" onclick="sperren(\''+esc(x.MAC)+'\',false)">freigeben</button>'
          :'<button class="kn klein" onclick="sperren(\''+esc(x.MAC)+'\',true)">sperren</button>')+
        (!x.Aktiv?' <button class="kn klein" onclick="wecken(\''+esc(x.MAC)+'\')">wecken</button>':'')+
      '</td></tr>';
  }).join('')||'<tr><td colspan="8" class="leer">nichts gefunden</td></tr>';

  return karte('Geräte im Netz',
    '<div class="werkzeug"><input type="search" placeholder="Name, IP, MAC oder Hersteller …" '+
      'value="'+esc(filter.q)+'" oninput="filter.q=this.value;zeichnen()">'+
      '<label class="f"><input type="checkbox" '+(filter.online?'checked':'')+
        ' onchange="filter.online=this.checked;zeichnen()"> nur online</label>'+
      '<label class="f"><input type="checkbox" '+(filter.funk?'checked':'')+
        ' onchange="filter.funk=this.checked;zeichnen()"> nur Funk</label></div>'+
    '<div class="rollt"><table><thead><tr>'+th('Name','Gerät')+th('IP','Adresse','m')+
      '<th class="m">MAC</th>'+th('Art','Anbindung')+th('Speed','Tempo','r')+
      '<th>Signal</th><th>Zustand</th><th class="r">Aktion</th></tr></thead>'+
      '<tbody>'+zeilen+'</tbody></table></div>',
    {voll:true,roh:true,zahl:liste.length+' von '+arr(g).length});
}
function sortiere(sp){ if(sortSp===sp) sortAb=!sortAb; else {sortSp=sp;sortAb=false;} zeichnen(); }

/* =============================================================== FUNK */
function zFunk(d){
  let h='';
  const netze=d.Netze, clients=d.Clients, gast=d.Gast;

  if(istFehler(netze)) h+=karte('Funknetze',fehlerBlock(netze,'WLAN-Einstellungen'));
  else{
    h+='<div class="gitter g3">';
    arr(netze).forEach(n=>{
      h+=karte(n.Band,
        '<div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">'+
          '<div><div style="font:700 22px/1 var(--sans)">'+zahl(n.Clients)+'</div>'+
          '<div class="zart">Geräte</div></div>'+
          '<button class="kn '+(n.An?'an':'aus')+'" style="margin-left:auto" '+
            'onclick="wlanSchalten('+n.Index+','+(!n.An)+')">'+(n.An?'an':'aus')+'</button></div>'+
        '<dl class="kv"><dt>Name</dt><dd>'+esc(n.SSID)+'</dd>'+
          '<dt>Kanal</dt><dd>'+esc(n.Kanal||'—')+'</dd>'+
          '<dt>Standard</dt><dd>'+esc(n.Standard||'—')+'</dd>'+
          '<dt>Sichtbar</dt><dd>'+(n.Sichtbar?'ja':'nein')+'</dd></dl>');
    });
    h+='</div>';
  }

  if(gast&&!istFehler(gast)){
    h+=karte('Gastzugang','<dl class="kv"><dt>Netzname</dt><dd>'+esc(gast.SSID)+'</dd>'+
      '<dt>Zustand</dt><dd>'+(gast.An?'<span class="pille p-pos">an</span>':
        '<span class="pille p-neutral">aus</span>')+'</dd>'+
      '<dt>Schlüssel</dt><dd><span id="gastKey">'+esc(gast.Schluessel||'—')+'</span></dd></dl>'+
      '<div style="margin-top:11px"><button class="kn" onclick="kopieren(\'gastKey\')">'+
      'Schlüssel kopieren</button></div>',{voll:true});
  }

  if(istFehler(clients)) h+=karte('Verbundene Funkgeräte',fehlerBlock(clients,'Client-Liste'));
  else{
    const zeilen=arr(clients).slice().sort((a,b)=>(b.Signal||0)-(a.Signal||0)).map(c=>
      '<tr><td class="m">'+esc(c.IP||'—')+'</td><td class="m zart">'+esc(c.MAC)+'</td>'+
      '<td><span class="pille p-info">'+esc(c.Band)+'</span></td>'+
      '<td class="m r">'+zahl(c.SpeedMbit)+' Mbit</td><td>'+signal(c.Signal)+'</td>'+
      '<td>'+(c.Angemeldet?'<span class="pille p-pos">angemeldet</span>':
        '<span class="pille p-krit">verbindet</span>')+'</td></tr>').join('')||
      '<tr><td colspan="6" class="leer">keine Funkgeräte verbunden</td></tr>';
    h+=karte('Verbundene Funkgeräte',
      '<div class="rollt kurz"><table><thead><tr><th class="m">Adresse</th><th class="m">MAC</th>'+
      '<th>Netz</th><th class="r">Aushandlung</th><th>Signal</th><th>Zustand</th></tr></thead>'+
      '<tbody>'+zeilen+'</tbody></table></div>',
      {voll:true,roh:true,zahl:arr(clients).length+' Geräte'});
  }
  return h;
}

/* ========================================================= MOBILGERÄTE */
function zMobil(d){
  const a=d.Analyse;
  if(!a||istFehler(a)) return fehlerBlock(a||{fehler:'keine Daten'},'Mobilgeräte');
  let h='';

  const g=arr(a.Geraete);
  if(!g.length){
    h+=karte('Mobilgeräte','<div class="leer">Kein Handy oder Tablet erkannt. '+
      'Erkannt wird an Name, Modell und Hersteller — benenne das Gerät in der FRITZ!Box '+
      'unter Heimnetz eindeutig, dann taucht es hier auf.</div>',{voll:true});
  }else{
    h+='<div class="gitter g2">';
    g.forEach(x=>{
      const strips=arr(x.Punkte).map(p=>{
        const kl={gut:'s-pos',warn:'s-krit',info:'s-info'}[p.Stufe]||'s-info';
        return '<div class="strip '+kl+'"><span>'+esc(p.Text)+'</span></div>';
      }).join('');
      h+=karte(x.Name||x.IP,
        '<dl class="kv" style="margin-bottom:13px">'+
        '<dt>Netz</dt><dd>'+esc(x.Band||'nicht verbunden')+'</dd>'+
        (x.Rate?'<dt>Aushandlung</dt><dd>'+zahl(x.Rate)+' Mbit/s</dd>':'')+
        (x.Signal?'<dt>Signal</dt><dd>'+x.Signal+' %</dd>':'')+
        '<dt>Adresse</dt><dd>'+esc(x.IP)+'</dd></dl>'+strips,
        {zahl:x.Aktiv?'online':'offline'});
    });
    h+='</div>';
  }

  const al=arr(a.Allgemein);
  if(al.length){
    h+=karte('Einstellungen, die allen Mobilgeräten helfen',al.map(x=>{
      const kl={gut:'s-pos',warn:'s-krit',info:'s-info'}[x.Stufe]||'s-info';
      return '<div class="strip '+kl+'"><div><b>'+esc(x.Titel)+'</b><span>'+esc(x.Text)+
        '</span></div></div>';
    }).join(''),{voll:true});
  }
  return h;
}

/* ============================================================ LEITUNG */
function zLeitung(d){
  let h='<div class="gitter g2">';
  const dsl=d.Dsl, fe=d.Fehler, wan=d.Wan, ds=d.Durchsatz, lan=d.Lan;

  if(istFehler(dsl)) h+=karte('Leitungsqualität',fehlerBlock(dsl,'DSL-Werte'));
  else{
    const sa=note(dsl.DownStoerabstand,10,6), saU=note(dsl.UpStoerabstand,10,6);
    h+=karte('Leitungsqualität',
      '<div style="display:flex;gap:22px;margin-bottom:14px">'+
      ['Empfang','Senden'].map((t,i)=>{
        const w=i?dsl.UpStoerabstand:dsl.DownStoerabstand, k=i?saU:sa;
        return '<div style="flex:1"><div style="font:700 26px/1.1 var(--sans);color:var(--'+k+')">'+
          zahl(w,1)+'<small style="font-size:12px;font-weight:400;color:var(--tx3)"> dB</small></div>'+
          '<div class="zart">Störabstand '+t+'</div>'+
          '<div class="balken b-'+k+'" style="margin-top:6px"><i style="width:'+
            Math.min(100,(w/20)*100)+'%"></i></div></div>';
      }).join('')+'</div>'+
      '<dl class="kv"><dt>Betriebsart</dt><dd>'+esc(dsl.Betriebsart)+'</dd>'+
      '<dt>Synchron</dt><dd>'+zahl(dsl.DownAktuellKbit/1000,1)+' / '+
        zahl(dsl.UpAktuellKbit/1000,1)+' Mbit/s</dd>'+
      '<dt>Höchstwert möglich</dt><dd>'+zahl(dsl.DownMaxKbit/1000,1)+' / '+
        zahl(dsl.UpMaxKbit/1000,1)+' Mbit/s</dd>'+
      '<dt>Dämpfung</dt><dd>'+zahl(dsl.DownDaempfung,1)+' / '+zahl(dsl.UpDaempfung,1)+' dB</dd>'+
      '<dt>Sendeleistung</dt><dd>'+zahl(dsl.DownLeistung,1)+' / '+zahl(dsl.UpLeistung,1)+' dBm</dd></dl>'+
      '<div class="zart" style="margin-top:12px;line-height:1.55">Der Störabstand ist die Reserve gegen '+
      'Rauschen. Unter 6 dB wird die Leitung instabil, ab 10 dB ist sie solide. Die Dämpfung hängt an '+
      'der Leitungslänge und lässt sich nicht ändern.</div>',{zahl:dsl.Status});
  }

  if(istFehler(fe)) h+=karte('Fehlerzähler',fehlerBlock(fe,'DSL-Statistik'));
  else{
    const z=(t,v,gut,mittel,hin)=>{
      const k=note(v,gut,mittel,true);
      return '<div style="display:flex;align-items:baseline;gap:11px;padding:6px 0;'+
        'border-bottom:1px solid var(--linie)"><span>'+esc(t)+'</span>'+
        (hin?'<span class="zart">'+esc(hin)+'</span>':'')+
        '<span class="m" style="margin-left:auto;color:var(--'+k+')">'+zahl(v)+'</span></div>';
    };
    h+=karte('Fehler seit dem letzten Synchronisieren',
      z('Neusynchronisierungen',fe.Neusynchronisierungen,2,8,'trennt jedes Mal alles')+
      z('Sekunden mit Fehlern',fe.FehlerSekunden,60,600)+
      z('davon schwer gestört',fe.SchwereFehlerSekunden,2,20)+
      z('CRC-Fehler',fe.CrcFehler,1000,10000,'nicht korrigierbar')+
      z('FEC-Fehler',fe.FecFehler,200000,2000000,'wurden korrigiert')+
      z('Rahmenverluste',fe.RahmenVerloren,2,20));
  }
  h+='</div><div class="gitter g2">';

  if(!istFehler(wan)){
    const dd=istFehler(ds)?null:ds;
    h+=karte('Verbindung',
      '<div style="display:flex;gap:20px;margin-bottom:12px">'+
      '<div style="flex:1"><div style="font:700 24px/1.1 var(--sans)">'+(dd?zahl(dd.DownMbit,1):'—')+
        '<small style="font-size:12px;font-weight:400;color:var(--tx3)"> Mbit/s</small></div>'+
        '<div class="zart">Download</div>'+graph(dd?dd.VerlaufDown:[],wan.DownMbit,'brand')+'</div>'+
      '<div style="flex:1"><div style="font:700 24px/1.1 var(--sans)">'+(dd?zahl(dd.UpMbit,1):'—')+
        '<small style="font-size:12px;font-weight:400;color:var(--tx3)"> Mbit/s</small></div>'+
        '<div class="zart">Upload</div>'+graph(dd?dd.VerlaufUp:[],wan.UpMbit,'info')+'</div></div>'+
      '<dl class="kv"><dt>Zugangsart</dt><dd>'+esc(wan.Zugangsart)+'</dd>'+
      '<dt>Status</dt><dd>'+esc(wan.Status)+'</dd>'+
      '<dt>Externe IP</dt><dd>'+esc(wan.ExterneIP)+'</dd>'+
      '<dt>Online seit</dt><dd>'+dauer(wan.OnlineSeitSek)+'</dd>'+
      '<dt>Letzter Fehler</dt><dd>'+esc(wan.LetzterFehler||'—')+'</dd></dl>'+
      '<div style="margin-top:13px"><button class="kn" onclick="neuverbinden()">'+
      'Neu verbinden (neue IP)</button></div>');
  }
  if(lan&&!istFehler(lan)){
    h+=karte('LAN-Anschluss der Box','<dl class="kv"><dt>Status</dt><dd>'+esc(lan.Status)+'</dd>'+
      '<dt>MAC</dt><dd>'+esc(lan.MacAdresse)+'</dd>'+
      '<dt>Gesendet</dt><dd>'+bytes(lan.PaketeGesendet)+'</dd>'+
      '<dt>Empfangen</dt><dd>'+bytes(lan.PaketeEmpfangen)+'</dd></dl>');
  }
  return h+'</div>';
}

/* ========================================================= SICHERHEIT */
function zSicherheit(d){
  let h='';
  const lage=d.Lage, fg=d.Freigaben, fw=d.Firmware, lok=d.Lokal;
  const punkte=[];
  if(!istFehler(lage)&&lage){
    if(lage.Upnp) punkte.push({t:'Selbstständige Portfreigaben (UPnP)',an:lage.Upnp.An,schlecht:lage.Upnp.An,
      gut:'aus — keine Anwendung öffnet eigenmächtig Ports',
      schlimm:'an — jede Anwendung im Haus darf sich einen Port ins Internet öffnen'});
    if(lage.Fernzugriff) punkte.push({t:'Fernzugriff aus dem Internet',an:lage.Fernzugriff.An,
      schlecht:lage.Fernzugriff.An,gut:'aus — die Box ist von außen nicht erreichbar',
      schlimm:'an — erreichbar über Port '+esc(lage.Fernzugriff.Port)});
    if(lage.MyFritz) punkte.push({t:'MyFRITZ',an:lage.MyFritz.An,schlecht:false,
      gut:'aus',schlimm:'an — '+esc(lage.MyFritz.Name||'')});
  }
  if(!istFehler(fw)&&fw) punkte.push({t:'Firmware',an:!fw.UpdateVerfuegbar,schlecht:fw.UpdateVerfuegbar,
    gut:'aktuell',schlimm:'Version '+esc(fw.NeueVersion)+' steht bereit'});

  const offen=punkte.filter(p=>p.schlecht).length;
  abzeichen('sicherheit',offen||'','');

  if(punkte.length){
    h+=karte('Einstellungen der Box',punkte.map(p=>
      '<div style="display:flex;gap:11px;align-items:flex-start;padding:10px 0;'+
      'border-bottom:1px solid var(--linie)"><span class="pkt d-'+(p.schlecht?'neg':'pos')+
      '" style="margin-top:6px"></span><div><div style="font-weight:600">'+esc(p.t)+'</div>'+
      '<div class="zart">'+(p.an?p.schlimm:p.gut)+'</div></div></div>').join(''),
      {voll:true,zahl:offen?offen+' offen':'unauffällig'});
  }

  h+='<div class="gitter g2">';
  if(istFehler(fg)) h+=karte('Portfreigaben',fehlerBlock(fg,'Portfreigaben'));
  else{
    const zeilen=arr(fg).map(p=>'<tr><td>'+esc(p.Beschreibung||'—')+'</td>'+
      '<td class="m">'+esc(p.Protokoll)+' '+esc(p.AussenPort)+'</td>'+
      '<td class="m zart">'+esc(p.Ziel)+':'+esc(p.ZielPort)+'</td>'+
      '<td>'+(p.Aktiv?'<span class="pille p-krit">offen</span>':
        '<span class="pille p-neutral">aus</span>')+'</td></tr>').join('')||
      '<tr><td colspan="4" class="leer">keine Portfreigaben — gut so</td></tr>';
    h+=karte('Portfreigaben','<div class="rollt kurz"><table><thead><tr><th>Beschreibung</th>'+
      '<th>von außen</th><th>nach innen</th><th>Zustand</th></tr></thead><tbody>'+zeilen+
      '</tbody></table></div>',{roh:true,zahl:String(arr(fg).length)});
  }
  if(lok&&!istFehler(lok)){
    const fwZ=arr(lok.Firewall).map(f=>'<dt>Firewall '+esc(f.Profil)+'</dt><dd>'+
      (f.An?'<span class="pille p-pos">an</span>':'<span class="pille p-neg">aus</span>')+'</dd>').join('');
    const smb=lok.Smb?'<dt>SMB1</dt><dd>'+(lok.Smb.Smb1?'<span class="pille p-neg">aktiv</span>':
      '<span class="pille p-pos">aus</span>')+'</dd><dt>SMB-Signatur</dt><dd>'+
      (lok.Smb.Signatur?'<span class="pille p-pos">erzwungen</span>':
      '<span class="pille p-krit">optional</span>')+'</dd>':'';
    h+=karte('Dieser PC','<dl class="kv">'+fwZ+smb+'<dt>Freigaben</dt><dd>'+
      (arr(lok.Freigaben).length||'keine')+'</dd><dt>Offene Sitzungen</dt><dd>'+
      arr(lok.Sitzungen).length+'</dd></dl>');
  }
  return h+'</div>';
}

      '</th></tr><tr><th>Gerät</th><th>Technik</th><th class="r m">WLAN</th><th>Anschlüsse</th>'+
      '<th class="r m">Preis</th><th>Wofür</th></tr></thead><tbody>'+
      kat.filter(g=>g.kategorie===gr).map(g=>
        '<tr><td><div>'+esc(g.name)+'</div><div class="zart">'+esc(g.hersteller)+
          (g.jahr?' · '+g.jahr:'')+'</div></td>'+
        '<td>'+(g.veraltet?'<span class="pille p-neg">'+esc(g.wlan)+'</span>':esc(g.wlan))+'</td>'+
        '<td class="m r">'+(g.wlanMbit?zahl(g.wlanMbit)+' Mbit':'—')+'</td>'+

/* ====================================================== NETZWERK-SCAN */
function zLokalnetz(d){
  let h='';
  const s=d.Scan;

  // --- Scan
  const werkz='<button class="kn stark" id="scanKn" onclick="scanStarten()">'+
    (s?'Erneut suchen':'Suche starten')+'</button>';

  if(!s){
    h+=karte('Geräte im Netz',
      '<div class="strip s-info"><div><b>Noch nicht gesucht</b><span>Der Suchlauf spricht alle 254 '+
      'Adressen deines Netzes gleichzeitig an und löst ihre Namen auf. Das dauert etwa fünf Sekunden '+
      'und braucht keinen Zugang zur FRITZ!Box.</span></div></div>',
      {voll:true,werkzeug:werkz});
  } else if(istFehler(s)){
    h+=karte('Geräte im Netz',fehlerBlock(s,'Suchlauf'),{voll:true,werkzeug:werkz});
  } else {
    const g=arr(s.Gefunden);
    const online=g.filter(x=>x.Erreichbar).length;
    const zeilen=g.map(x=>{
      const k=x.Ms===null||x.Ms===undefined?'':(x.Ms<=1?'pos':(x.Ms<=5?'krit':'neg'));
      let rolle='';
      if(x.Rolle==='Router') rolle='<span class="pille p-brand">Router</span>';
      else if(x.Rolle==='dieser Rechner') rolle='<span class="pille p-info">dieser PC</span>';
      else if(!x.Erreichbar) rolle='<span class="pille p-neutral">nur bekannt</span>';
      return '<tr><td class="m">'+esc(x.IP)+'</td>'+
        '<td>'+(x.Name?esc(x.Name):'<span class="zart">ohne Namen</span>')+'</td>'+
        '<td class="m zart">'+esc(x.MAC||'—')+'</td>'+
        '<td>'+(x.Hersteller?esc(x.Hersteller):'<span class="zart">—</span>')+'</td>'+
        '<td class="m r"'+(k?' style="color:var(--'+k+')"':'')+'>'+
          (x.Ms!==null&&x.Ms!==undefined?x.Ms+' ms':'—')+'</td>'+
        '<td>'+rolle+'</td></tr>';
    }).join('');

    h+=karte('Geräte im Netz',
      '<div class="werkzeug" style="border-top:none">'+
        '<div><div class="zart">Netz</div><b class="m">'+esc(s.Netz)+'</b></div>'+
        '<div><div class="zart">gefunden</div><b class="m" style="font-size:15px">'+g.length+'</b></div>'+
        '<div><div class="zart">davon erreichbar</div><b class="m" style="font-size:15px;color:var(--pos)">'+
          online+'</b></div>'+
        '<div style="margin-left:auto" class="zart">Stand '+esc(s.Zeit)+'</div>'+
      '</div>'+
      '<div class="rollt"><table><thead><tr><th class="m">Adresse</th><th>Name</th>'+
      '<th class="m">MAC</th><th>Hersteller</th><th class="r">Antwort</th><th></th></tr></thead>'+
      '<tbody>'+zeilen+'</tbody></table></div>',
      {voll:true,roh:true,werkzeug:werkz});

    h+='<div class="hilfe" style="padding:0 2px;margin:-6px 0 14px">Geräte ohne Antwort, die trotzdem '+
       'auftauchen, standen in der Adresstabelle deines Rechners — sie waren kürzlich da und schweigen '+
       'gerade. „Zufällige Adresse" heißt: Das Gerät vergibt seine MAC selbst neu, wie es Handys zum '+
       'Schutz vor Verfolgung tun.</div>';
  }

  h+='<div class="gitter g2">';

  // --- Eigene Anbindung
  const ab=arr(d.Anbindung);
  if(ab.length){
    h+=karte('Deine Anbindung',ab.map(a=>
      '<div style="padding:9px 0;border-bottom:1px solid var(--linie)">'+
      '<div style="font-weight:600">'+esc(a.Name)+'</div>'+
      '<div class="zart">'+esc(a.Karte)+'</div>'+
      '<dl class="kv" style="margin-top:7px">'+
        '<dt>Adresse</dt><dd>'+esc(a.IP)+'</dd>'+
        '<dt>Verbindung</dt><dd>'+esc(a.LinkSpeed)+'</dd>'+
        '<dt>Router</dt><dd>'+esc(a.Gateway)+'</dd>'+
        '<dt>Namensauflösung</dt><dd>'+esc(arr(a.Dns).join(', ')||'—')+'</dd>'+
      '</dl>'+
      (a.KannMehr?'<div class="strip s-info" style="margin-top:9px"><div>'+
        '<b>Läuft unter ihrem Können</b><span>Diese Karte beherrscht '+esc(a.KannMehr)+
        ', handelt aber '+esc(a.LinkSpeed)+' aus. Die Gegenstelle gibt nicht mehr her.</span></div>'+
        '<button class="kn klein" onclick="wechseln(\'hardware\')">Beratung</button></div>':'')+
      '</div>').join(''));
  }

  // --- Internet-Güte
  const net=arr(d.Internet);
  if(net.length){
    h+=karte('Güte der Internetverbindung',
      '<table><thead><tr><th>Ziel</th><th class="r">min</th><th class="r">Schnitt</th>'+
      '<th class="r">max</th><th class="r">Schwankung</th><th class="r">Verlust</th></tr></thead><tbody>'+
      net.map(x=>{
        const kl=x.VerlustProzent>0?'neg':(x.Jitter>10?'krit':(x.Schnitt>40?'krit':'pos'));
        return '<tr><td>'+esc(x.Ziel)+'<div class="zart m">'+esc(x.IP)+'</div></td>'+
          '<td class="m r">'+(x.Min??'—')+'</td>'+
          '<td class="m r" style="color:var(--'+kl+')">'+(x.Schnitt??'—')+'</td>'+
          '<td class="m r">'+(x.Max??'—')+'</td>'+
          '<td class="m r">'+(x.Jitter??'—')+'</td>'+
          '<td class="m r"'+(x.VerlustProzent>0?' style="color:var(--neg)"':'')+'>'+
            x.VerlustProzent+' %</td></tr>';
      }).join('')+'</tbody></table>'+
      '<div class="hilfe" style="margin-top:11px">Die Schwankung sagt mehr über die Güte einer Leitung '+
      'als der Mittelwert: Sie ist es, die Videoanrufe stocken und Spiele ruckeln lässt. Unter 5 ms ist '+
      'gut, über 20 ms wird es spürbar.</div>',{roh:false});
  }
  h+='</div><div class="gitter g2">';

  // --- Weg ins Internet
  const weg=arr(d.Weg);
  if(weg.length){
    h+=karte('Weg ins Internet',
      weg.map(x=>{
        const kl=x.Ms===null||x.Ms===undefined?'aus':(x.Ms<=15?'pos':(x.Ms<=50?'krit':'neg'));
        return '<div style="display:flex;gap:11px;align-items:baseline;padding:6px 0;'+
          'border-bottom:1px solid var(--linie)">'+
          '<span class="m zart" style="width:22px">'+x.Sprung+'.</span>'+
          '<span class="m">'+esc(x.IP)+'</span>'+
          (x.Privat?'<span class="pille p-neutral">im Haus</span>':'')+
          (x.Name?'<span class="zart" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px">'+esc(x.Name)+'</span>':'')+
          '<span class="m" style="margin-left:auto;color:var(--'+kl+')">'+
            (x.Ms!==null&&x.Ms!==undefined?x.Ms+' ms':'*')+'</span></div>';
      }).join('')+
      '<div class="hilfe" style="margin-top:11px">Der erste Sprung ist dein Router. Springt die Zeit '+
      'erst danach nach oben, liegt es an der Leitung oder am Anbieter — nicht an deinem Netz.</div>');
  }

  // --- Offene Dienste
  const di=arr(d.Dienste);
  if(di.length){
    const heikel=di.filter(x=>x.Beachten).length;
    h+=karte('Offene Dienste auf diesem PC',
      '<table><thead><tr><th class="r m">Port</th><th>Programm</th><th>Dienst</th></tr></thead><tbody>'+
      di.map(x=>'<tr><td class="m r"'+(x.Beachten?' style="color:var(--krit)"':'')+'>'+x.Port+'</td>'+
        '<td>'+esc(x.Prozess||'—')+'</td>'+
        '<td class="zart">'+esc(x.Dienst||'')+'</td></tr>').join('')+
      '</tbody></table>'+
      '<div class="hilfe" style="margin-top:11px">Jeder Eintrag ist eine Tür, die im Netz offensteht. '+
      (heikel?'Die '+heikel+' hervorgehobenen sind Windows-Dienste, die in einem Netz mit fremden '+
       'Geräten nichts zu suchen haben — dort lohnt eine Firewall-Regel.'
      :'Nichts davon ist auffällig.')+'</div>',
      {zahl:di.length+' offen'});
  }

  return h+'</div>';
}

async function scanStarten(){
  const kn=document.getElementById('scanKn');
  if(kn){ kn.disabled=true; kn.textContent='sucht …'; }
  try{
    const r=await fetch('/api/scan',{cache:'no-store'});
    const d=await r.json();
    daten.lokalnetz=d;
    zeichnen();
  }catch(e){
    alert('Suchlauf fehlgeschlagen: '+e.message);
    if(kn){ kn.disabled=false; kn.textContent='Suche starten'; }
  }
}

    f('PanelPort','Port dieses Panels',k.PanelPort,'Erst nach einem Neustart wirksam','number')+
    '<div class="strip '+(d.ZugangDa?'s-pos':'s-krit')+'"><div>'+
      '<b>Zugangsdaten '+(d.ZugangDa?'hinterlegt':'fehlen')+'</b><span>'+
      (d.ZugangDa
        ?'Verschlüsselt gespeichert. Ändern mit <span class="m">netzpanel einrichten</span>.'
        :'Ohne sie zeigt das Panel keine echten Daten. <span class="m">netzpanel einrichten</span> ausführen.')+
      '</span></div></div>'+
    (d.Demo?'<div class="strip s-krit"><div><b>Beispielmodus aktiv</b><span>Es werden erfundene Daten '+
      'angezeigt und nichts geschaltet.</span></div></div>':''));

  h+=karte('Wann das Panel warnt',
    '<div class="hilfe" style="margin-bottom:13px">Diese Schwellen bestimmen, ab wann ein Wert als '+
    'knapp oder kritisch gilt.</div>'+
    f('StoerabstandGut','Störabstand gilt ab … dB als solide',k.StoerabstandGut,'','number')+
    f('StoerabstandKnapp','… und unter … dB als kritisch',k.StoerabstandKnapp,'','number')+
    f('MeshFunkGut','Mesh-Funkstrecke gilt ab … Mbit/s als gut',k.MeshFunkGut,'','number')+
    f('MeshFunkKnapp','… und unter … Mbit/s als zu langsam',k.MeshFunkKnapp,'','number')+
    f('SignalGut','Funksignal gilt ab … % als gut',k.SignalGut,'','number')+
    f('SignalKnapp','… und unter … % als schwach',k.SignalKnapp,'','number')+
    f('CrcFehlerGrenze','CRC-Fehler melden ab',k.CrcFehlerGrenze,'','number')+
    f('NeusyncGrenze','Neusynchronisierungen melden ab',k.NeusyncGrenze,'','number'));
  h+='</div>';

  h+=karte('Speicherort',
    '<dl class="kv"><dt>Einstellungen</dt><dd>'+esc(d.KonfigPfad||'')+'</dd></dl>'+
    '<div class="hilfe" style="margin-top:9px">Einstellungen und Zugangsdaten liegen außerhalb des '+
    'Programmordners. Ein Update überschreibt sie nicht, und sie geraten nie in ein Git-Repository.</div>'+
    '<div style="margin-top:14px;display:flex;gap:9px">'+
    '<button class="kn stark" onclick="einstellungenSpeichern()">Speichern</button>'+
    '<button class="kn" onclick="laden()">Verwerfen</button></div>',{voll:true});
  return h;
}
async function einstellungenSpeichern(){
  const ids=['BoxAdresse','BoxPort','PanelPort','StoerabstandGut','StoerabstandKnapp',
             'MeshFunkGut','MeshFunkKnapp','SignalGut','SignalKnapp','CrcFehlerGrenze','NeusyncGrenze'];
  const k={};
  ids.forEach(i=>{ const el=document.getElementById(i); if(el) k[i]=el.value; });
  const alt=daten.einstellungen&&daten.einstellungen.Konfig;
  if(alt){ ['Farbschema','StartAnsicht'].forEach(x=>k[x]=alt[x]); }
  try{
    const r=await fetch('/api/einstellungen',{method:'POST',body:JSON.stringify(k)});
    const d=await r.json();
    if(d.fehler) throw new Error(d.fehler);
    frisch();
  }catch(e){ alert('Speichern fehlgeschlagen: '+e.message); }
}

/* ============================================================ AKTIONEN */
async function senden(pfad,koerper){
  try{
    const r=await fetch(pfad,{method:'POST',body:JSON.stringify(koerper)});
    const d=await r.json();
    if(d.fehler){ alert('Fehlgeschlagen: '+d.fehler); return false; }
    return true;
  }catch(e){ alert('Fehlgeschlagen: '+e.message); return false; }
}
async function sperren(mac,an){
  if(an&&!confirm('Diesem Gerät den Internetzugang sperren?')) return;
  if(await senden('/api/sperre',{mac:mac,sperren:an})) setTimeout(frisch,600);
}
async function wecken(mac){
  if(await senden('/api/wecken',{mac:mac})) alert('Weckruf gesendet an '+mac);
}
async function wlanSchalten(index,an){
  const n={1:'2,4 GHz',2:'5 GHz',3:'Gastnetz'};
  if(!an&&!confirm('Funknetz '+n[index]+' wirklich abschalten?')) return;
  if(await senden('/api/wlan',{index:index,an:an})) setTimeout(frisch,900);
}
async function steckdose(ain,an){
  if(await senden('/api/steckdose',{ain:ain,an:an})) setTimeout(frisch,900);
}
async function neuverbinden(){
  if(!confirm('Internetverbindung trennen und neu aufbauen? Das unterbricht alles für einige Sekunden.')) return;
  if(await senden('/api/neuverbinden',{})) setTimeout(frisch,4000);
}
function kopieren(id){
  const t=document.getElementById(id);
  if(!t) return;
  navigator.clipboard.writeText(t.textContent).then(()=>{
    const a=t.textContent; t.textContent='kopiert'; setTimeout(()=>t.textContent=a,1100);
  },()=>alert('Kopieren nicht möglich.'));
}

/* =============================================================== Start */
navBauen();

// Zuerst den Betriebszustand klären: ohne Zugangsdaten ist die Übersicht leer,
// dann startet das Panel sinnvollerweise beim Netzwerk-Scan.
fetch('/api/einstellungen').then(r=>r.json()).then(d=>{
  const ausHash=location.hash.replace('#','');
  if(d.Demo){
    document.getElementById('led').classList.add('demo');
    document.getElementById('shellSub').textContent='Beispielmodus — keine echten Daten';
  } else if(d.Lokal){
    document.getElementById('led').classList.add('demo');
    document.getElementById('shellSub').textContent='Lokal-Modus — ohne Zugang zur FRITZ!Box';
    if(!ausHash) aktiv='lokalnetz';
  }
  if(ANSICHTEN.some(a=>a.id===ausHash)) aktiv=ausHash;
  wechseln(aktiv);
}).catch(()=>{
  const ausHash=location.hash.replace('#','');
  if(ANSICHTEN.some(a=>a.id===ausHash)) aktiv=ausHash;
  wechseln(aktiv);
});
</script>
